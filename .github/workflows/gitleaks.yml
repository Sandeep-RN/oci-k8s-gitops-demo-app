name: gitleaks

# Backstop for the pre-commit hook (ADR 0011): `git commit --no-verify` skips
# local hooks, so every PR and push is scanned here as well. Scans the FULL
# history, not just the new commits: a secret that was committed and later
# deleted is still public, and must fail until it is rotated.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_<version>_linux_x64.tar.gz from the release's checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks

      - name: Scan history
        # --redact: findings are printed without the secret itself (the log is public).
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner
