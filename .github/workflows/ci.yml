name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the image job raises only what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only. On main, every run must finish so its
  # image and tag bump are not cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the image is worth building and deploying. A docs-only
  # merge must not rebuild the image, push a new tag and restart the pods.
  # Fails safe: any doubt (new branch, force push, a git error) means "build".
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base="$BASE_PUSH"
          [ "$EVENT" = "pull_request" ] && base="$BASE_PR"
          # What goes into the image: the backend (its Dockerfile lives there) and
          # this workflow, whose build, scan and bump steps are part of the pipeline.
          pattern='^(backend/|\.github/workflows/ci\.yml$)'
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! files="$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null)"; then
            echo "cannot compute the diff; building to be safe"
            echo "image=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf 'changed files:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -Eq "$pattern"; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "no image-relevant changes; skipping image and bump"
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Real PostgreSQL for the integration tests (same major version as the
    # cluster). Throwaway and job-local, so trust auth: no password exists.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The integration tests skip without PGHOST. In CI a skip would hide a
      # broken database setup, so any skipped test fails the job.
      - name: pytest (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "tests were skipped in CI"; exit 1; fi

  image:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR (main only; the step is skipped on PRs)
    env:
      REGISTRY: ghcr.io
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR requires a lowercase repository path; github.repository may not be.
      - name: Compute image name
        id: image
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}-backend"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build one local amd64 image and scan it BEFORE anything is pushed, so a
      # vulnerable image never reaches the registry (and so never gets deployed).
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: scan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # fail only on vulnerabilities that have a fix
          exit-code: "1"

      # The image starts and answers /healthz. A non-default port proves the
      # port comes from UVICORN_PORT. No database: /healthz does not need one.
      # Then / must serve the landing page: proves the HTML file is in the image,
      # which the unit tests (run from the source tree) cannot.
      - name: Container smoke test
        run: |
          docker run -d --name smoke -e UVICORN_PORT=8080 -p 127.0.0.1:8080:8080 "scan:${GITHUB_SHA}"
          trap 'docker rm -f smoke >/dev/null' EXIT
          up=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; up=true; break; fi
            sleep 1
          done
          if [ "$up" != true ]; then
            echo "::error::/healthz did not answer on port 8080 within 30 s"
            docker logs smoke
            exit 1
          fi
          if ! curl -fsS http://127.0.0.1:8080/ | grep -q '<h1>'; then
            echo "::error::/ did not serve the landing page"
            docker logs smoke
            exit 1
          fi
          echo "landing page served"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (ADR 0015). On PRs it builds both platforms without pushing,
      # proving the arm64 build works. On main it pushes the immutable SHA tag.
      - name: Build multi-arch image (push on main only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ADR 0009: open a PR in the gitops repo that sets the new image tag, with
  # auto-merge on. It merges only after the gitops repo's required `validate`
  # check passes; ArgoCD then syncs. CI never talks to a cluster.
  bump-gitops:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {} # everything below uses GITOPS_TOKEN, not GITHUB_TOKEN
    # One bump at a time, never cancelled, so two quick merges cannot race.
    concurrency:
      group: bump-gitops
      cancel-in-progress: false
    env:
      GITOPS_REPO: Sandeep-RN/oci-k8s-gitops-demo-gitops
      KUSTOMIZATION: apps/link-shortener/base/kustomization.yaml
      IMAGE: ${{ needs.image.outputs.image }}
      TAG: ${{ github.sha }}
      # Fine-grained PAT limited to the gitops repo: contents + pull requests write.
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Set image tag
        id: bump
        working-directory: gitops
        run: |
          set -euo pipefail
          # yq is preinstalled on GitHub's Ubuntu runners. Matching on the image
          # name (not a line number) keeps this correct if the file is reordered.
          yq -i '(.images[] | select(.name == strenv(IMAGE))) |= (.newTag = strenv(TAG) | .newTag line_comment = "")' "$KUSTOMIZATION"
          grep -q "newTag: ${TAG}" "$KUSTOMIZATION" || { echo "image ${IMAGE} not found in ${KUSTOMIZATION}"; exit 1; }
          if git diff --quiet; then
            echo "Tag already ${TAG}; nothing to do (re-run?)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open auto-merging PR and close superseded ones
        if: steps.bump.outputs.changed == 'true'
        working-directory: gitops
        run: |
          set -euo pipefail
          short="${TAG::12}"
          branch="bump/backend-${short}"
          git config user.name "oci-k8s-gitops-demo-app CI"
          git config user.email "noreply@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Bump backend image to ${short}" \
            -m "From ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${TAG}"
          # --force-with-lease makes a workflow re-run idempotent.
          git push --force-with-lease -u origin "$branch"

          gh label create tag-bump --repo "$GITOPS_REPO" --color 0E8A16 \
            --description "Automated image tag bump (ADR 0009)" --force >/dev/null

          pr="$(gh pr list --repo "$GITOPS_REPO" --head "$branch" --state open \
            --json url --jq '.[0].url')"
          if [ -z "$pr" ]; then
            body="Automated tag bump (ADR 0009) from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${TAG}."
            body+=" Auto-merges when the validate check passes; ArgoCD then syncs."
            pr="$(gh pr create --repo "$GITOPS_REPO" --head "$branch" --base main \
              --label tag-bump --title "Bump backend image to ${short}" --body "$body")"
          fi
          # Squash keeps gitops main linear (required by branch protection).
          gh pr merge "$pr" --repo "$GITOPS_REPO" --auto --squash --delete-branch
          echo "Opened ${pr}"

          # Older open bumps would conflict with this one and deploy stale tags.
          gh pr list --repo "$GITOPS_REPO" --label tag-bump --state open \
            --json number,headRefName \
            --jq ".[] | select(.headRefName != \"${branch}\") | .number" |
          while read -r old; do
            gh pr close "$old" --repo "$GITOPS_REPO" --delete-branch \
              --comment "Superseded by ${pr}."
          done
